
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidad Aumentada - Miku</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #aviso {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      color: white;
      background: #153451;
      border-radius: 8px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="aviso">Cargando a Miku...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./Miku.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="modeloMiku"
        src="./miku_papercraft.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#modeloMiku"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="15.1 15.1 15.1">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const escena = document.querySelector("a-scene");
    const aviso = document.querySelector("#aviso");
    const marcador = document.querySelector("[mindar-image-target]");

    escena.addEventListener("arReady", () => {
      aviso.textContent = "¡Cámara lista! Enfoca la imagen de Miku.";
    });

    escena.addEventListener("arError", () => {
      aviso.textContent = "No se pudo iniciar la cámara.";
    });

    marcador.addEventListener("targetFound", () => {
      aviso.textContent = "¡Miku apareció!";
    });

    marcador.addEventListener("targetLost", () => {
      aviso.textContent = "Busca de nuevo tu marcador.";
    });
  </script>
</body>
</html>
